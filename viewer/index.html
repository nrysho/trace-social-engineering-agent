<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Replay</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080e1b; --panel: #111a2a; --panel-2: #152134; --ink: #eef4ff; --muted: #90a3bd; --line: #26364c;
  --accent: #48e1c0; --accent-soft: #15362f; --violet: #8e94ff; --blue: #67b3ff; --amber: #f3c274;
  --s-proposed: #788aa4; --s-active: #67b3ff; --s-engaged: #48e1c0; --s-suspicious: #f3c274;
  --s-failed: #f18491; --s-incident: #a69aff; --s-exhausted: #90a3bd;
  --ghost: #61748e; --shadow: 0 14px 40px rgba(0,0,0,.24);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(ellipse at 80% -10%,#17264a 0,transparent 39%), radial-gradient(ellipse at -12% 70%,#0d2a36 0,transparent 36%), var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 20px;
  background: rgba(8,16,29,.88); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.brand { display: flex; flex-direction: column; margin-right: 8px; }
.brand strong { font-size: 16px; }
.muted { color: var(--muted); font-size: 12px; }
select, button { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid #31475f;
  border-radius: 9px; padding: 7px 11px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
button:hover, select:hover { border-color: var(--accent); background: #1b3042; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
.chip { border: 1px solid #2d4056; background: #111d30; color: #b3c4d6; border-radius: 999px; padding: 5px 10px; font-size: 12px; white-space: nowrap; }
.chip b { font-weight: 600; }
.chip.win { border-color: var(--s-incident); color: var(--s-incident); }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
main { display: grid; grid-template-columns: minmax(400px, 40%) minmax(0, 1fr); min-height: 0; }
.treePane { position: relative; min-height: 0; overflow: auto; scrollbar-color: #3b576d transparent; }
#tree { display: block; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; padding: 10px 22px; font-size: 15px; color: #c9d4e3;
  background: rgba(8,16,29,.96); border-top: 1px solid var(--line); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px;
  margin-right: 8px; vertical-align: -2px; background: var(--c); }
.inspector { background: linear-gradient(160deg,rgba(19,31,49,.98),rgba(14,23,39,.98)); border-right: 1px solid var(--line); overflow: auto; padding: 20px 26px 48px; font-size: 15px; min-height: 0; box-shadow: var(--shadow); }
.inspector h2 { font-size: 21px; margin: 10px 0 8px; line-height: 1.3; }
.inspector h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px;
  border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.badge.status { color: #fff; background: var(--c); }
.badge.ok { background: color-mix(in srgb, var(--s-engaged) 16%, transparent); color: var(--s-engaged); }
.badge.warn { background: color-mix(in srgb, var(--s-suspicious) 16%, transparent); color: var(--s-suspicious); }
.card { border: 1px solid #30445e; border-radius: 11px; padding: 10px 12px; margin: 8px 0; background: #142237; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.metric { flex: 1; min-width: 120px; }
.metric .num { font-size: 20px; font-weight: 650; }
.bar { height: 7px; border-radius: 20px; background: #26354d; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg,var(--violet),var(--accent)); }
.rej { border-left: 3px solid var(--ghost); padding: 4px 0 4px 10px; margin: 8px 0; }
.rej b { display: block; }
a { color: var(--accent); }
.mailhead { border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 10px 12px; background: var(--panel-2); font-size: 13px; }
.mailhead div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mailhead .subj { font-weight: 650; font-size: 14px; margin-top: 2px; }
.frame { border: 1px solid var(--line); border-radius: 0 0 10px 10px; overflow: hidden; background: #fff; position: relative; }
.frame iframe { border: 0; transform-origin: 0 0; display: block; background: #fff; }
.urlbar { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0;
  padding: 7px 10px; background: var(--panel-2); font-size: 12px; }
.urlbar .dots { color: var(--ghost); letter-spacing: 2px; }
.urlbar .url { flex: 1; background: #0d1727; border-radius: 6px; padding: 3px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bubble { border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; background: #142237; border: 1px solid var(--line); }
.bubble.them { border-color: color-mix(in srgb, var(--s-engaged) 45%, var(--line)); }
.bubble .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; white-space: normal; }
.event { padding: 8px 12px; border-radius: 10px; margin: 8px 0; font-weight: 550; }
.event.link { background: color-mix(in srgb, var(--s-suspicious) 14%, transparent); color: var(--s-suspicious); }
.event.win { background: color-mix(in srgb, var(--s-incident) 14%, transparent); color: var(--s-incident); }
.event.none { color: var(--muted); font-weight: 400; font-style: italic; }
.transcript div { padding: 3px 0; }
.transcript .who { font-weight: 650; margin-right: 6px; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.fact .src { grid-column: 1 / -1; font-size: 12px; }
footer { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: rgba(8,16,29,.94); border-top: 1px solid var(--line); }
footer input[type=range] { flex: 1; accent-color: var(--accent); }
#stepLabel { min-width: 230px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 40px 20px; text-align: center; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.node { cursor: pointer; }
.node rect.box { transition: stroke .15s, stroke-width .15s, filter .15s; }
.node:hover rect.box { stroke-width: 2.5; filter: brightness(1.18); }
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid #2d4056; border-radius: 11px; background: #0d1727; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
body:not([data-view="replay"]) main, body:not([data-view="replay"]) footer, body:not([data-view="replay"]) .replay-only { display: none !important; }
body:not([data-view="results"]) #results, body:not([data-view="progress"]) #progress { display: none; }
.page { overflow: auto; padding: 22px 24px 48px; min-height: 0; }
.page h2 { font-size: 18px; margin: 0 0 4px; }
.page h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
.tile { border: 1px solid #30445e; border-radius: 10px; background: #111b2c; padding: 8px 14px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 21px; font-weight: 650; margin: 1px 0 0; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--muted); }
.tile .d.up { color: var(--s-engaged); } .tile .d.down { color: var(--s-failed); }
.chartcard { border: 1px solid #30445e; border-radius: 12px; background: #111b2c; padding: 14px 16px 8px; position: relative; }
.chartcard .legendrow { display: flex; gap: 16px; font-size: 12px; color: #b3c4d6; margin-bottom: 6px; }
.chartcard .legendrow span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 3px; }
.chartgrid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
.tip { position: absolute; pointer-events: none; background: #0b1424; border: 1px solid #3b576d; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap; box-shadow: var(--shadow); }
.tip b { color: var(--ink); }
.cellwin { color: var(--s-incident); font-weight: 600; }
.headline { font-size: 18px; line-height: 1.35; font-weight: 600; margin: 10px 0 0; max-width: 980px; }
.headline em { font-style: normal; color: var(--accent); }
@media (max-width: 900px) { .chartgrid { grid-template-columns: 1fr; } }
.tablewrap { overflow-x: auto; border: 1px solid #30445e; border-radius: 12px; background: #111b2c; }
table.res { border-collapse: collapse; width: 100%; font-size: 13px; }
table.res th { text-align: left; font-weight: 600; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.res td { padding: 9px 12px; border-bottom: 1px solid #1d2a3d; white-space: nowrap; }
table.res td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.res tr:last-child td { border-bottom: 0; }
table.res tbody tr.click { cursor: pointer; }
table.res tbody tr.click:hover { background: #17263b; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #1b2a40; color: #b3c4d6; }
.pill.bench { background: var(--accent-soft); color: var(--accent); }
.pill.revel8 { background: color-mix(in srgb, var(--blue) 18%, transparent); color: var(--blue); }
.pill.agent { background: color-mix(in srgb, var(--violet) 20%, transparent); color: var(--violet); }
.win { color: var(--s-incident); font-weight: 600; }
.bad { color: var(--s-failed); font-weight: 600; }
.paneltools { display: flex; justify-content: flex-end; margin: -6px 0 6px; }
.fsbtn { font-size: 12.5px; padding: 5px 10px; }
.inspector:fullscreen { padding: 48px max(28px, 14vw) 64px; background: var(--bg); font-size: 17px; }
.webmail { background: #fff; color: #202124; border-radius: 14px; overflow: hidden; font-family: Arial, Helvetica, sans-serif; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.wm-bar { display: flex; align-items: center; gap: 14px; padding: 9px 16px; background: #f2f5fa; color: #5f6368; font-size: 14px; border-bottom: 1px solid #e6e9ef; }
.wm-pill { background: #e3e8f0; color: #3c4043; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.wm-spacer { flex: 1; } .wm-icon { font-size: 17px; color: #5f6368; }
.wm-subject { font-size: 23px; line-height: 1.3; padding: 16px 22px 6px; color: #1f1f1f; }
.wm-from { display: flex; align-items: center; gap: 12px; padding: 8px 22px 6px; }
.wm-av { width: 42px; height: 42px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 700; flex: none; }
.wm-who { min-width: 0; font-size: 15.5px; } .wm-who b { color: #1f1f1f; }
.wm-addr { color: #5f6368; font-size: 14.5px; word-break: break-all; }
.webmail mark, .linkrow mark { background: #fde68a; color: #1f1f1f; padding: 0 3px; border-radius: 3px; }
.wm-to { color: #5f6368; font-size: 13.5px; margin-top: 1px; }
.wm-time { margin-left: auto; color: #5f6368; font-size: 13.5px; white-space: nowrap; align-self: flex-start; padding-top: 4px; }
.webmail .frame { border: 0; border-radius: 0; }
.wm-atts { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 22px 14px; }
.wm-att { display: flex; align-items: center; gap: 10px; border: 1px solid #dadce0; border-radius: 8px; padding: 9px 14px; font-size: 14.5px; color: #3c4043; }
.wm-ext { background: #c5221f; color: #fff; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 3px 6px; }
.wm-actions { display: flex; gap: 12px; padding: 12px 22px 16px; border-top: 1px solid #eceff1; }
.wm-actions span { border: 1px solid #c4c7c5; border-radius: 18px; padding: 7px 18px; font-size: 14px; color: #3c4043; }
.linkrow { border-left: 3px solid #30445e; padding: 8px 14px; margin: 6px 0; border-radius: 0 10px 10px 0; font-size: 15px; word-break: break-all; }
.linkrow .lt { color: #d3dcea; } .linkrow .lh { color: #b3c4d6; font-size: 14.5px; }
.linkrow.warn { border-left-color: var(--s-suspicious); background: rgba(243,194,116,.08); }
.linkrow .lw { color: var(--s-suspicious); font-size: 13.5px; margin-top: 3px; }
.banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 14px; margin-bottom: 20px; font-size: 26px; font-weight: 750; letter-spacing: -.01em; }
.banner small { display: block; font-size: 15px; font-weight: 500; letter-spacing: 0; color: #d3dcea; margin-top: 2px; }
.banner .star { font-size: 34px; color: var(--s-incident); }
.banner.win { background: linear-gradient(135deg, rgba(166,154,255,.22), rgba(72,225,192,.14)); border: 1px solid var(--s-incident); color: #f1efff; }
.banner.none { background: #142237; border: 1px solid #30445e; color: #c9d4e3; }
.banner.void { background: rgba(241,132,145,.12); border: 1px solid var(--s-failed); color: var(--s-failed); }
.profilehead { display: flex; gap: 18px; align-items: center; margin: 4px 0 8px; }
.avatar { width: 68px; height: 68px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 25px; font-weight: 750;
  color: #07111f; background: linear-gradient(135deg, var(--violet), var(--accent)); }
.pname { font-size: 28px; font-weight: 750; line-height: 1.15; }
.prole { font-size: 17.5px; color: #d3dcea; margin-top: 3px; }
.pdomain { font-size: 14px; color: var(--muted); margin-top: 2px; }
.psec { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 10px; }
.pcat { font-size: 14px; font-weight: 650; color: #d3dcea; margin: 16px 0 6px; }
.hookcard { border: 1px solid #30445e; background: #142237; border-radius: 12px; padding: 12px 16px; margin: 8px 0; cursor: pointer; transition: border-color .15s, background .15s; }
.hookcard:hover { border-color: #4b6a8a; }
.hookcard.on { border-color: var(--accent); background: rgba(72,225,192,.08); }
.hookcard .t { font-size: 17.5px; font-weight: 650; }
.hookcard .r { font-size: 14px; color: var(--muted); margin-top: 2px; }
.factrow { border-left: 3px solid #30445e; padding: 8px 14px; margin: 6px 0; font-size: 17px; line-height: 1.5; border-radius: 0 10px 10px 0; transition: background .2s, opacity .2s; }
.factrow .src { font-size: 13px; color: var(--muted); margin-top: 3px; }
.factrow.hit { border-left-color: var(--accent); background: rgba(72,225,192,.11); }
.factrow.dim { opacity: .42; }
.why { border: 1px solid rgba(72,225,192,.55); background: rgba(72,225,192,.07); border-radius: 12px; padding: 14px 18px; font-size: 17px; line-height: 1.55; margin: 14px 0; }
.why .k { font-size: 12.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin-bottom: 4px; }
.why .src { font-size: 13px; color: var(--muted); }
.rej { font-size: 15.5px; } .rej span { display: block; color: #b3c4d6; }
.inspector .bubble { font-size: 16px; line-height: 1.55; }
.inspector .event { font-size: 15.5px; }
.inspector .transcript { font-size: 16px; }
.mailhead { font-size: 15px !important; } .mailhead .subj { font-size: 18px !important; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
  .inspector { border-left: 0; border-top: 1px solid var(--line); }
  #stepLabel { min-width: 0; }
}
</style>
</head>
<body data-view="replay">
<header>
  <div class="brand"><strong>Run Replay</strong><span class="muted">read-only · no send controls</span></div>
  <nav class="tabs" aria-label="View">
    <button id="tabReplay" class="on">Replay</button>
    <button id="tabResults">Results</button>
    <button id="tabProgress">Progress</button>
  </nav>
  <select id="runPick" class="replay-only" aria-label="Run"></select>
  <div id="chips" class="chips replay-only"></div>
  <label class="toggle replay-only"><input type="checkbox" id="ghosts"> show rejected options</label>
  <label class="toggle replay-only" title="Reload this run and the run list every 5 seconds while the agent is running"><input type="checkbox" id="live" checked> live</label>
</header>
<section id="results" class="page" aria-label="Results"></section>
<section id="progress" class="page" aria-label="Progress"></section>
<main>
  <aside class="inspector" id="inspector"><div class="empty">Loading runs…</div></aside>
  <section class="treePane" id="treePane">
    <svg id="tree" role="img" aria-label="Decision tree"></svg>
  </section>
</main>
<div class="legend replay-only" id="legend"></div>
<footer>
  <button id="first" title="First step">⏮</button>
  <button id="prev" title="Previous step (←)">◀</button>
  <button id="play" title="Play">Play</button>
  <button id="next" title="Next step (→)">▶</button>
  <button id="last" title="Show everything">⏭</button>
  <input type="range" id="step" min="1" max="1" value="1" aria-label="Replay step">
  <span id="stepLabel"></span>
</footer>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
const LEVELS = { target: "Target", hook: "Hook", approach: "Approach", contact: "Contact", reaction: "Reaction" };
const STATUSES = { proposed: "Proposed", active: "Active", engaged: "Engaged", suspicious: "Suspicious",
  failed: "Failed", incident: "Incident", exhausted: "Out of touches" };
const LIVE_CHANNELS = new Set(["phone_call", "video_call", "teams_call", "live_chat"]);
const W = 220, H = 74, GX = 26, GY = 64, PAD = 28;

let run = null, order = [], step = 1, selected = null, timer = null;

// ---------- small DOM helpers (text only, never innerHTML) ----------
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
function sv(tag, attrs = {}) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const statusColor = (s) => css(`--s-${s}`) || css("--s-proposed");
// The incident happens on a touch (contact) and is read off its reaction; the decisions above it led there.
const statusLabel = (n) => (n.status === "incident" && ["target", "hook", "approach"].includes(n.level) ? "Led to incident" : STATUSES[n.status] || n.status);
const pct = (x) => `${Math.round((x || 0) * 100)}%`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeHref = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const time = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}
async function loadRuns(prefer) {
  const pick = $("runPick");
  try {
    const runs = await getJSON("/api/runs");
    const groupOf = (id) => (id.startsWith("bench-") ? "Bench (fictional personas)" : id.startsWith("chat-") ? "revel8 practice (by hand)"
      : ["sample", "mock"].includes(id) ? "Examples" : "Agent runs");
    const groups = {};
    for (const r of runs) (groups[groupOf(r.id)] ||= []).push(r);
    const label = (r) => r.error ? `${r.id} (unreadable)`
      : `${r.target || r.id} · ${r.contacts} touch${r.contacts === 1 ? "" : "es"}${r.incident ? " · ★ incident" : ""}${r.id === "sample" ? " · demo" : r.id === "mock" ? " · mock data" : ""}`;
    pick.replaceChildren(...["Agent runs", "Bench (fictional personas)", "revel8 practice (by hand)", "Examples"].filter((g) => groups[g])
      .map((g) => el("optgroup", { label: g }, ...groups[g].map((r) => el("option", { value: r.id, text: label(r) })))));
    // Open the most useful run first: an agent run, else the branching demo.
    const wanted = prefer || new URLSearchParams(location.search).get("run")
      || groups["Agent runs"]?.[0]?.id || (runs.some((r) => r.id === "sample") ? "sample" : null);

    const hit = sv("rect", { x: cx - band / 2, y: T, width: band, height: H - T - B, fill: "transparent" });
    hit.addEventListener("mouseenter", () => tipAt(card, svg, cx, T + 10, W, [v.label, tip(v), `${v.runs} run${v.runs === 1 ? "" : "s"}`]));
    hit.addEventListener("mouseleave", () => hideTip(card));
    svg.append(hit);
  });
  card.append(svg);
  return card;
}
const incidentChart = (vs) => barChart(vs, { key: "incident_rate", title: "Incident rate per version", max: 1, ticks: [0, 0.5, 1],
  fmt: (v) => `${Math.round(v * 100)}%`, tip: (v) => `Incident in ${fmtPct(v.incident_rate)} of runs`, empty: "–", W: 1200, H: 260 });
const touchesChart = (vs) => {
  const max = Math.max(10, ...vs.map((v) => v.median_touches_to_incident || 0));
  return barChart(vs, { key: "median_touches_to_incident", title: "Median touches to first incident", sub: "lower is better · scoring sessions have 10 touches",
    max, ticks: [0, max / 2, max], fmt: (v) => String(Math.round(v * 10) / 10), empty: "no incident",
    tip: (v) => (v.median_touches_to_incident != null ? `Median ${v.median_touches_to_incident} touches to first incident` : "No incident in any run") });
};
function tile(k, v, d, cls = "") {
  return el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: `d ${cls}`, text: d }));
}
function change(cur, first, firstLabel, fmt, higherIsBetter) {
  if (cur == null || first == null) return ["", ""];
  const diff = cur - first;
  if (!diff) return [`same as ${firstLabel}`, ""];
  const good = higherIsBetter ? diff > 0 : diff < 0;
  return [`${diff > 0 ? "▲" : "▼"} ${fmt(Math.abs(diff))} vs ${firstLabel}`, good ? "up" : "down"];
}
async function renderProgress() {
  const box = $("progress");
  box.replaceChildren(el("div", { class: "empty", text: "Loading progress…" }));
  let data;
  try { data = await getJSON("/api/progress"); }
  catch (e) { return box.replaceChildren(el("div", { class: "empty", text: `Could not load progress (${e.message})` })); }
  const intro = [el("h2", { text: "Agent progress" }),
    el("div", { class: "muted", text: "Measured on fictional people the agent has never seen, whose weak spots we planted." })];
  const vs = data.versions;
  if (!vs.length) return box.replaceChildren(...intro, el("div", { class: "card", style: "margin-top:18px",
    text: "No agent versions yet. Run the agent on the bench (http://127.0.0.1:8770/v1) and send the header X-Bench-Label: v1 with POST /v1/sessions. Each new label appears here as a version." }));
  const first = vs[0], last = vs[vs.length - 1], pts = (d) => `${Math.round(d * 100)} pts`;
  const [dInc, cInc] = change(last.incident_rate, first.incident_rate, first.label, pts, true);
  const [dTop, cTop] = change(last.topic_hit_share, first.topic_hit_share, first.label, pts, true);
  const [dTch, cTch] = change(last.median_touches_to_incident, first.median_touches_to_incident, first.label, (d) => `${d}`, false);
  const versionRows = vs.map((v) => el("tr", {},
    el("td", { text: v.label }), el("td", { text: new Date(v.first_run).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) }),
    el("td", { class: "num", text: String(v.runs) }), el("td", { class: v.incident_rate ? "num win" : "num", text: fmtPct(v.incident_rate) }),
    el("td", { class: "num", text: dash(v.median_touches_to_incident) }), el("td", { class: "num", text: fmtPct(v.topic_hit_share) }),
    el("td", { class: v.voided ? "num bad" : "num", text: String(v.voided) })));
  const personaRows = vs.map((v) => el("tr", {}, el("td", { text: v.label }), ...data.personas.map((p) => {
    const runs = v.sessions.filter((s) => s.persona === p);
    if (!runs.length) return el("td", { class: "muted", text: "not tested" });
    return el("td", {}, ...runs.map((s, i) => {
      const text = s.voided ? "voided" : s.first_incident_touch ? `★ touch ${s.first_incident_touch}` : `no incident (${s.touches} touches)`;
      const span = el("span", { class: s.voided ? "bad" : s.first_incident_touch ? "cellwin" : "", style: "cursor:pointer", title: "Open in Replay",
        text: `${i ? " · " : ""}${text}, hooks ${s.topic_hits}/${s.touches}` });
      span.addEventListener("click", () => openFromResults(`bench-${s.session_id}`));
      return span;
    }));
  })));
  const touchesText = last.median_touches_to_incident != null ? ` in a median of ${last.median_touches_to_incident} touches` : "";
  const sinceText = vs.length > 1 ? `, up from ${fmtPct(first.incident_rate)} in ${first.label}` : "";
  const headline = el("p", { class: "headline" }, `${last.label} reaches an incident in `, el("em", { text: fmtPct(last.incident_rate) }),
    ` of runs${touchesText}${sinceText}.`);
  box.replaceChildren(...intro, headline,
    el("div", { class: "tiles" },
      tile("Incident rate", fmtPct(last.incident_rate), dInc, cInc),
      tile("Median touches to incident", dash(last.median_touches_to_incident), dTch, cTch),
      tile("Hooks found", fmtPct(last.topic_hit_share), dTop, cTop)),
    el("div", { style: "margin-top:12px" }, incidentChart(vs)),
    el("h3", { style: "margin-top:44px", text: "Details for the team" }),
    el("div", { class: "chartgrid" }, rateChart(vs), touchesChart(vs)),
    el("h3", { text: "Per persona (click a result to replay it)" }),
    table([["Version"], ...data.personas.map((p) => [p])], personaRows),
    el("h3", { text: "Numbers" }),
    table([["Version"], ["First run"], ["Runs", 1], ["Incident rate", 1], ["Median touches", 1], ["Hooks found", 1], ["Voided", 1]], versionRows));
}

const VIEWS = { replay: "tabReplay", results: "tabResults", progress: "tabProgress" };
function showView(v) {
  document.body.dataset.view = v;
  for (const [name, tab] of Object.entries(VIEWS)) $(tab).classList.toggle("on", name === v);
  const q = new URLSearchParams(location.search);
  if (v === "replay") q.delete("view"); else q.set("view", v);
  history.replaceState(null, "", `?${q}`);
  if (v !== "replay") stopPlay();
  if (v === "results") renderResults();
  if (v === "progress") renderProgress();
}
for (const [name, tab] of Object.entries(VIEWS)) $(tab).addEventListener("click", () => showView(name));

$("runPick").addEventListener("change", (e) => openRun(e.target.value));
$("ghosts").addEventListener("change", () => { drawTree(); drawChips(); });

// ---------- live: follow a run while the agent is still writing it ----------
// The agent saves the run after every contact. Every 5 s, reload the open run; if it grew and you
// were watching the latest step, jump to the newest node. New runs join the list every 15 s.
let liveTick = 0;
setInterval(async () => {
  if (!$("live").checked || document.body.dataset.view !== "replay" || !run || timer) return;
  const id = $("runPick").value;
  liveTick += 1;
  try {
    if (liveTick % 3 === 0) {
      const runs = await getJSON("/api/runs");
      const known = new Set([...$("runPick").options].map((o) => o.value));
      if (runs.some((r) => !known.has(r.id))) { await loadRuns(id); return; }
    }
    const fresh = await getJSON(`/api/runs/${encodeURIComponent(id)}`);
    if ((fresh.nodes || []).length === run.nodes.length && JSON.stringify(fresh.events || {}) === JSON.stringify(run.events)) return;
    const atEnd = step >= order.length;
    const keep = selected?.id;
    run = fresh; run.nodes = run.nodes || []; run.messages = run.messages || []; run.events = run.events || {};
    order = [...run.nodes].sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp)));
    $("step").max = Math.max(1, order.length);
    if (atEnd) setStep(order.length);
    else select(order.find((n) => n.id === keep) || order[order.length - 1]);
    const opt = [...$("runPick").options].find((o) => o.value === id);
    const touches = run.nodes.filter((n) => n.level === "contact").length;
    if (opt) opt.textContent = `${run.profile?.name || id} · ${touches} touch${touches === 1 ? "" : "es"}${run.nodes.some((n) => n.status === "incident") ? " · ★ incident" : ""} · live`;
  } catch (e) { /* the run file is being rewritten; try again next tick */ }
}, 5000);
$("first").addEventListener("click", () => { stopPlay(); setStep(1); });
$("prev").addEventListener("click", () => { stopPlay(); setStep(step - 1); });
$("next").addEventListener("click", () => { stopPlay(); setStep(step + 1); });
$("last").addEventListener("click", () => { stopPlay(); setStep(order.length); });
$("play").addEventListener("click", play);
$("step").addEventListener("input", (e) => { stopPlay(); setStep(Number(e.target.value)); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" || document.body.dataset.view !== "replay") return;
  if (e.key === "ArrowRight") { stopPlay(); setStep(step + 1); }
  if (e.key === "ArrowLeft") { stopPlay(); setStep(step - 1); }
  if (e.key === " ") { e.preventDefault(); play(); }
  if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFullscreen();
});
loadRuns();
{ const v = new URLSearchParams(location.search).get("view"); if (v in VIEWS && v !== "replay") showView(v); }
